[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churnopt"
version = "2.0.0"
description = "Customer churn prediction and retention economics: calibrated models, leakage audit, SQL analysis, and a profit-based contact policy"
authors = [{email = "bkumar25@asu.edu"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "shap>=0.44",
    "duckdb>=1.0",
    "matplotlib>=3.7",
    "streamlit>=1.30",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "nbformat>=5.9",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
]

[project.scripts]
churnopt = "run_pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = 'archive'

[tool.isort]
profile = "black"
line_length = 100
skip = ["archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
addopts = "-q"
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
